
replicas: 2 # TODO: Adjust the amount depending on your requirements

# Using a license file with the helm chart:
# https://github.com/rstudio/helm/tree/main/charts/rstudio-connect#license-file
# If you would like to use a license key see this documentation:
# https://github.com/rstudio/helm/tree/main/charts/rstudio-connect#license-key
license:
  file:
    secret: posit-licenses # TODO: Change to the secret name in your cluster
    secretKey: connect.lic # TODO: Change to the secret key containing your Connect license

# Configures Connect shared storage
sharedStorage:
  create: true
  mount: true
  storageClassName: nfs-sc-rwx # TODO: Change to a RWX StorageClass available in your cluster
  # volumeName: connect-shared-pv-name # Only needed if PVs have been statically provisioned, in which case this will need to match the PV name.
  requests:
    storage: 100G

launcher:
  enabled: false

backends:
  kubernetes:
    enabled: true # Required for Off-Host Execution mode (Connect 2026.04.0 and later)

securityContext:
  privileged: false

# Define the image used to execute content.
# Each entry describes the runtime versions available in a content image.
# Match these to the runtime versions in your content image.
# You can also manage execution environments through the Connect UI or API.
# See:
# https://docs.posit.co/connect/admin/appendix/off-host/execution-environments
executionEnvironments:
  - name: posit/connect-content:R4.6-python3.14-ubuntu-24.04-pro # TODO: Change to match your content image
    title: "Default Runtime"
    description: "Runtime with R, Python, and Quarto"
    python:
      installations:
        - path: /opt/python/3.14.6/bin/python3 # TODO: Match the Python path in your content image
          version: 3.14.6 # TODO: Match the Python version in your content image
    r:
      installations:
        - path: /opt/R/4.6.1/bin/R # TODO: Match the R path in your content image
          version: 4.6.1 # TODO: Match the R version in your content image
    quarto:
      installations:
        - path: /opt/quarto/bin/quarto # TODO: Match the Quarto path in your content image
          version: 1.9.38 # TODO: Match the Quarto version in your content image

# The config section overwrites values in Posit Connect's main
# .gcfg configuration file.
config:
  # Configures the Postgres connection for Posit Connect.
  Database:
    Provider: "Postgres"
  Postgres:
    # The URL syntax below is to utilize a PostgreSQL database installed
    # in the cluster as described in the Kubernetes Cluster Preparation
    # page of this guide. Change this URL if your PostgreSQL database is
    # setup externally or in a different location.
    URL: "postgres://connect@postgres.example.com:5432/connect?sslmode=disable"
    Password: "<PASSWORD>" # TODO: Remove this line and instead set the password during helm install with --set config.Postgres.Password=<your-postgres-password>.

  # For authenticated Package Manager repositories, create a Package Manager integration in Connect.
  # Connect then gives each build short-lived credentials. No extra volumes or secrets are necessary.
  # https://docs.posit.co/connect/admin/integrations/package-manager/#authenticated-repositories
  # The integration requires the Enhanced or Advanced tier. On the Basic tier, mount a netrc file instead:
  # https://docs.posit.co/rspm/admin/connect.html#authenticated-repositories
  "RPackageRepository \"CRAN\"":
    URL: https://packagemanager.posit.co/cran/__linux__/noble/latest # TODO: If using Package Manager change to match your package manager R repo url
  # If using other R repos, add them here using the below format
  # "RPackageRepository \"INTERNAL\"":
  #   URL: https://packagemanager.posit.co/cran/__linux__/noble/latest
  "PythonPackageRepository \"PyPI\"":
    URL: https://packagemanager.posit.co/pypi/latest/simple # TODO: If using Package Manager change to match your package manager Python repo url
  # If using other Python repos, add them here using the below format
  # "PythonPackageRepository \"INTERNAL\"":
  #   URL: https://packagemanager.example.com/pypi/internal/simple
  Quarto:
    Enabled: true
