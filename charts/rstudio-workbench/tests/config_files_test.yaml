suite: Workbench config files (list form, list values, defaults)
templates:
  - configmap-general.yaml
  - configmap-session.yaml
tests:
  # -- order-sensitive files accept the list form and keep its order
  - it: should render config.server.profiles written as a list in the order written
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          profiles:
            - "*": {max-memory-mb: 1024}
            - "@analysts": {max-memory-mb: 4096}
            - "12345": {max-memory-mb: 512}
    asserts:
      - equal:
          path: data["profiles"]
          value: |
            [*]
            max-memory-mb=1024

            [@analysts]
            max-memory-mb=4096

            [12345]
            max-memory-mb=512

  - it: should render a launcher resources file written as a list in the order written
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          launcher.kubernetes.resources.conf:
            - small: {name: Small, cpus: 1, mem-mb: 1024}
            - large: {name: Large, cpus: 8, mem-mb: 16384}
    asserts:
      - matchRegex:
          path: data["launcher.kubernetes.resources.conf"]
          pattern: "(?s)^\\[small\\].*\\[large\\]"

  # -- list values
  - it: should comma-join a list inside a section
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          logging.conf:
            "*": {log-level: [info, debug]}
    asserts:
      - matchRegex:
          path: data["logging.conf"]
          pattern: "(?m)^log-level=info,debug$"

  - it: should repeat a top-level key for a list of values
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          rserver.conf:
            www-allow-origin: [one.example.com, two.example.com]
    asserts:
      - matchRegex:
          path: data["rserver.conf"]
          pattern: "(?m)^www-allow-origin=one.example.com\\nwww-allow-origin=two.example.com$"

  - it: should repeat [cluster] for a list of clusters and keep the [server] defaults
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          launcher.conf:
            cluster:
              - {name: Kubernetes, type: Kubernetes}
              - {name: Local, type: Local}
    asserts:
      - matchRegex:
          path: data["launcher.conf"]
          pattern: "\\[cluster\\]\\nname=Kubernetes\\ntype=Kubernetes\\n\\n\\[cluster\\]\\nname=Local\\ntype=Local\\n"
      - matchRegex:
          path: data["launcher.conf"]
          pattern: "(?m)^\\[server\\]$"
      - matchRegex:
          path: data["launcher.conf"]
          pattern: "(?m)^port=5559$"

  # -- lists are rejected for order-agnostic files
  # -- table 2 (order-sensitive .ini files): every row accepts a list
  - it: should accept a list for config.server.launcher.local.profiles.conf
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          launcher.local.profiles.conf:
            - "@b": {max-cpus: 2}
            - "@a": {max-cpus: 1}
    asserts:
      - matchRegex:
          path: data["launcher.local.profiles.conf"]
          pattern: "^\\[@b\\]\\nmax-cpus=2\\n\\n\\[@a\\]\\nmax-cpus=1\\n"

  - it: should accept a list for config.profiles.launcher.local.profiles.conf
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        profiles:
          launcher.local.profiles.conf:
            - "@b": {max-cpus: 2}
            - "@a": {max-cpus: 1}
    asserts:
      - matchRegex:
          path: data["launcher.local.profiles.conf"]
          pattern: "^\\[@b\\]\\nmax-cpus=2\\n\\n\\[@a\\]\\nmax-cpus=1\\n"

  - it: should accept r-versions in config.serverDcf
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        serverDcf:
          r-versions:
            - {Path: /opt/R/4.4.1, Label: Latest}
            - {Path: /opt/R/4.0.2, Label: Old}
    asserts:
      - matchRegex:
          path: data["r-versions"]
          pattern: "Label: Latest\\nPath: /opt/R/4.4.1\\n\\nLabel: Old\\nPath: /opt/R/4.0.2"

  # -- [*] session image defaults in config.profiles
  - it: should add the default [*] at the top of a kubernetes profiles list without one
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        profiles:
          launcher.kubernetes.profiles.conf:
            - "@gpu": {container-images: [gpu-image:1]}
    asserts:
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "^\\[\\*\\]\\nallow-unknown-images=1\\ncontainer-images=posit/workbench-session:[^\\n]+\\ndefault-container-image=posit/workbench-session:[^\\n]+\\n\\n\\[@gpu\\]\\ncontainer-images=gpu-image:1\\n"

  - it: should merge the default [*] into the [*] entry of a kubernetes profiles list, where it is
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        profiles:
          launcher.kubernetes.profiles.conf:
            - "@gpu": {max-cpus: 8}
            - "*": {max-cpus: 2, allow-unknown-images: 0}
    asserts:
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "^\\[@gpu\\]\\nmax-cpus=8\\n\\n\\[\\*\\]\\nallow-unknown-images=0\\ncontainer-images=posit/workbench-session:[^\\n]+\\ndefault-container-image=posit/workbench-session:[^\\n]+\\nmax-cpus=2\\n"

  - it: should keep merging the default [*] into a kubernetes profiles map
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        profiles:
          launcher.kubernetes.profiles.conf:
            "@gpu": {max-cpus: 8}
            "*": {max-cpus: 2}
    asserts:
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "^\\[\\*\\]\\nallow-unknown-images=1\\ncontainer-images=posit/workbench-session:[^\\n]+\\ndefault-container-image=posit/workbench-session:[^\\n]+\\nmax-cpus=2\\n\\n\\[@gpu\\]\\nmax-cpus=8\\n"

  - it: should fail when [*] appears twice in a config.profiles list
    template: configmap-general.yaml
    set:
      config:
        profiles:
          launcher.kubernetes.profiles.conf:
            - "*": {max-cpus: 2}
            - "*": {max-cpus: 4}
    asserts:
      - failedTemplate:
          errorPattern: "the \\[\\*\\] section appears more than once"

  - it: should add the default job-json-overrides to a non-kubernetes profiles list with useTemplates=false
    template: configmap-general.yaml
    documentIndex: 0
    set:
      launcher:
        useTemplates: false
      config:
        profiles:
          launcher.local.profiles.conf:
            - "@gpu":
                job-json-overrides:
                  - name: gpu
                    target: /spec/template/spec/tolerations
                    json: []
    asserts:
      - matchRegex:
          path: data["launcher.local.profiles.conf"]
          pattern: "^\\[\\*\\]\\njob-json-overrides=\"/spec/template/spec/volumes/-\":\"/mnt/job-json-overrides-new/defaultSessionVolume.json\",\"/spec/template/spec/containers/0/volumeMounts/-\":\"/mnt/job-json-overrides-new/defaultSessionVolumeMount.json\"\\n\\n\\[@gpu\\]\\njob-json-overrides=\"/spec/template/spec/volumes/-\":\"/mnt/job-json-overrides-new/defaultSessionVolume.json\",\"/spec/template/spec/containers/0/volumeMounts/-\":\"/mnt/job-json-overrides-new/defaultSessionVolumeMount.json\",\"/spec/template/spec/tolerations\":\"/mnt/job-json-overrides-new/gpu.json\"\\n"

  # -- CRAN default in repos.conf
  - it: should render the default CRAN repos.conf when it isn't set
    template: configmap-session.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: data["repos.conf"]
          value: |
            CRAN=https://packagemanager.posit.co/cran/__linux__/noble/latest

  - it: should add CRAN to a repos.conf map without one
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          repos.conf:
            Internal: https://pkgs.example.com/internal
    asserts:
      - equal:
          path: data["repos.conf"]
          value: |
            CRAN=https://packagemanager.posit.co/cran/__linux__/noble/latest
            Internal=https://pkgs.example.com/internal

  - it: should add CRAN at the top of a repos.conf list without one
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          repos.conf:
            - Internal: https://pkgs.example.com/internal
            - Another: https://pkgs.example.com/another
    asserts:
      - equal:
          path: data["repos.conf"]
          value: |
            CRAN=https://packagemanager.posit.co/cran/__linux__/noble/latest
            Internal=https://pkgs.example.com/internal
            Another=https://pkgs.example.com/another

  - it: should keep the user's CRAN in a repos.conf list where it is
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          repos.conf:
            - Internal: https://pkgs.example.com/internal
            - CRAN: https://cran.example.com
    asserts:
      - equal:
          path: data["repos.conf"]
          value: |
            Internal=https://pkgs.example.com/internal
            CRAN=https://cran.example.com

  - it: should use a repos.conf string as-is
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          repos.conf: |
            Internal=https://pkgs.example.com/internal
    asserts:
      - equal:
          path: data["repos.conf"]
          value: |
            Internal=https://pkgs.example.com/internal

  - it: should render no repos.conf when it is null
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          repos.conf: null
    asserts:
      - notExists:
          path: data["repos.conf"]
      - exists:
          path: data["rsession.conf"]

  # -- a file name may be in only one of config.server, config.serverDcf and config.profiles
  # -- default [cluster] in launcher.conf, provided by the template
  - it: should render the default [cluster] when launcher.conf doesn't set one
    template: configmap-general.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["launcher.conf"]
          pattern: "^\\[cluster\\]\\nname=Kubernetes\\ntype=Kubernetes\\n\\n\\[server\\]"

  - it: should merge the default [cluster] into a cluster map
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          launcher.conf:
            cluster:
              name: Other
    asserts:
      - matchRegex:
          path: data["launcher.conf"]
          pattern: "^\\[cluster\\]\\nname=Other\\ntype=Kubernetes\\n"

  - it: should use a list of clusters as-is
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          launcher.conf:
            cluster:
              - {name: Local, type: Local}
    asserts:
      - matchRegex:
          path: data["launcher.conf"]
          pattern: "^\\[cluster\\]\\nname=Local\\ntype=Local\\n\\n\\[server\\]"

  - it: should omit [cluster] when it is null
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        server:
          launcher.conf:
            cluster: null
    asserts:
      - notMatchRegex:
          path: data["launcher.conf"]
          pattern: "\\[cluster\\]"
      - matchRegex:
          path: data["launcher.conf"]
          pattern: "\\[server\\]"

  # -- check 1: config.profiles only takes launcher profiles files

  - it: should fail on a non-profiles file in config.profiles, as a map
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        profiles:
          other.conf:
            section: {a: 1}
    asserts:
      - failedTemplate:
          errorPattern: "config.profiles.other.conf: config.profiles only takes launcher.\\*.profiles.conf files. Move it to config.server."

  - it: should fail on r-versions in config.profiles, pointing to config.server
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        profiles:
          r-versions:
            cluster:
              - {name: Kubernetes, type: Kubernetes}
              - {name: Local, type: Local}
    asserts:
      - failedTemplate:
          errorPattern: "config.profiles.r-versions: config.profiles only takes launcher.\\*.profiles.conf files. Move it to config.server."

  - it: should report launcher.conf in config.profiles as misplaced, before it collides with the default
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        profiles:
          launcher.conf:
            cluster:
              - {name: Kubernetes, type: Kubernetes}
    asserts:
      - failedTemplate:
          errorPattern: "^\\s*config.profiles.launcher.conf: config.profiles only takes launcher.\\*.profiles.conf files. Move it to config.server.\\s*$"

  - it: should fail on a resources file in config.profiles, as a list
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        profiles:
          launcher.kubernetes.resources.conf:
            - small: {cpus: 1}
    asserts:
      - failedTemplate:
          errorPattern: "config.profiles.launcher.kubernetes.resources.conf: config.profiles only takes launcher.\\*.profiles.conf files. Move it to config.server."

  # -- check 2: a file name in only one of config.server, config.serverDcf, config.profiles

  - it: should fail when a profiles file is in both config.server and config.profiles
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        server:
          launcher.local.profiles.conf:
            "*": {max-cpus: 1}
        profiles:
          launcher.local.profiles.conf:
            "*": {max-cpus: 2}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.launcher.local.profiles.conf and config.profiles.launcher.local.profiles.conf are both written to /mnt/configmap/rstudio/launcher.local.profiles.conf, so only one would be used"

  - it: should fail when a file is in both config.server and config.serverDcf
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        server:
          r-versions: |
            Path: /opt/R/4.4.1
        serverDcf:
          r-versions:
            - {Path: /opt/R/4.0.2}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.r-versions and config.serverDcf.r-versions are both written to"

  - it: should fail when the deprecated kubernetes profiles location is used alongside config.profiles
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        server:
          launcher.kubernetes.profiles.conf:
            "*": {max-cpus: 1}
        profiles:
          launcher.kubernetes.profiles.conf:
            "*": {max-cpus: 2}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.launcher.kubernetes.profiles.conf and config.profiles.launcher.kubernetes.profiles.conf are both written to"

  - it: should say that a colliding copy may be a chart default
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        serverDcf:
          rserver.conf:
            - {a: 1}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.rserver.conf and config.serverDcf.rserver.conf are both written to .*\\(one of them may be a chart default\\)"

  # -- check 3: files that aren't .ini must be strings; check 4: lists

  - it: should fail on a list for a file that doesn't depend on order, listing the files that accept one
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        server:
          launcher.conf:
            - server: {port: 5559}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.launcher.conf is written as a list, but only order-sensitive files accept a list \\(profiles, launcher.\\*.profiles.conf, launcher.\\*.resources.conf, repos.conf\\). Write it as a map; to repeat a section, give that section a list of maps."

  - it: should fail on r-versions in config.session written as a list
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        session:
          r-versions:
            - {Path: /opt/R/4.4.1}
    asserts:
      - failedTemplate:
          errorPattern: "config.session.r-versions: r-versions is a DCF file, not an .ini file. Write the whole file as a string \\(r-versions: \\|\\), or move it to config.serverDcf as a list of records."

  - it: should fail on r-versions in config.server written as a list
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        server:
          r-versions:
            - {Path: /opt/R/4.4.1}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.r-versions: r-versions is a DCF file, not an .ini file. Write the whole file as a string \\(r-versions: \\|\\), or move it to config.serverDcf as a list of records."

  - it: should point notifications.conf written as a list to the string form
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        session:
          notifications.conf:
            - {Message: hello}
    asserts:
      - failedTemplate:
          errorPattern: "config.session.notifications.conf: notifications.conf is a DCF file, not an .ini file. Write the whole file as a string \\(notifications.conf: \\|\\)."

  - it: should point rstudio-prefs.json written as a list to the string form
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        session:
          rstudio-prefs.json:
            - {a: 1}
    asserts:
      - failedTemplate:
          errorPattern: "config.session.rstudio-prefs.json: This is a JSON file, not an .ini file. Write the whole file as a string."

  - it: should point a server json file written as a list to the string form
    # the checks run in both ConfigMaps; failedTemplate only sees them in configmap-session.yaml
    template: configmap-session.yaml
    set:
      config:
        server:
          vscode-user-settings.json:
            - {a: 1}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.vscode-user-settings.json: This is a JSON file, not an .ini file. Write the whole file as a string."

  - it: should fail on r-versions written as a map, the user's example
    template: configmap-session.yaml
    set:
      config:
        server:
          r-versions:
            cluster:
              - {name: Kubernetes, type: Kubernetes}
              - {name: Local, type: Local}
    asserts:
      - failedTemplate:
          errorPattern: "config.server.r-versions: r-versions is a DCF file, not an .ini file. Write the whole file as a string \\(r-versions: \\|\\), or move it to config.serverDcf as a list of records."

  - it: should fail on notifications.conf written as a map
    template: configmap-session.yaml
    set:
      config:
        session:
          notifications.conf:
            Message: hello
    asserts:
      - failedTemplate:
          errorPattern: "config.session.notifications.conf: notifications.conf is a DCF file, not an .ini file. Write the whole file as a string \\(notifications.conf: \\|\\)."

  - it: should fail on a json file written as a map
    template: configmap-session.yaml
    set:
      config:
        server:
          positron-user-settings.json:
            a: 1
    asserts:
      - failedTemplate:
          errorPattern: "config.server.positron-user-settings.json: This is a JSON file, not an .ini file. Write the whole file as a string."

  - it: should accept files that aren't .ini as strings, and the empty notifications.conf default
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          r-versions: |
            Path: /opt/R/4.4.1
          rstudio-prefs.json: |
            {"save_workspace": "never"}
    asserts:
      - equal:
          path: data["r-versions"]
          value: |
            Path: /opt/R/4.4.1
      - exists:
          path: data["notifications.conf"]

  # -- table 1 rows that the tests above don't cover
  - it: should fail on notifications.conf in config.server, even as a string
    template: configmap-session.yaml
    set:
      config:
        server:
          notifications.conf: |
            EndTime: 2026-06-05
            Message: hello
    asserts:
      - failedTemplate:
          errorPattern: "config.server.notifications.conf: Sessions read notifications.conf, so move it to config.session, as a string \\(notifications.conf: \\|\\)."

  - it: should accept notifications.conf in config.session as a string
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          notifications.conf: |
            EndTime: 2026-06-05
            Message: hello
    asserts:
      - equal:
          path: data["notifications.conf"]
          value: |
            EndTime: 2026-06-05
            Message: hello

  - it: should fail on a non-profiles file in config.profiles even as a string
    template: configmap-session.yaml
    set:
      config:
        profiles:
          other.conf: |
            a=1
    asserts:
      - failedTemplate:
          errorPattern: "config.profiles.other.conf: config.profiles only takes launcher.\\*.profiles.conf files. Move it to config.server."

  - it: should accept a launcher profiles file in config.profiles (the allow row comes before the catch-all)
    template: configmap-general.yaml
    documentIndex: 0
    set:
      config:
        profiles:
          launcher.local.profiles.conf:
            "*": {max-cpus: 2}
    asserts:
      - matchRegex:
          path: data["launcher.local.profiles.conf"]
          pattern: "max-cpus=2"

  - it: should accept config.session.profiles written as a list, in the order written
    template: configmap-session.yaml
    documentIndex: 0
    set:
      config:
        session:
          profiles:
            - "*": {max-memory-mb: 1024}
            - "@analysts": {max-memory-mb: 4096}
            - "12345": {max-memory-mb: 512}
    asserts:
      - equal:
          path: data["profiles"]
          value: |
            [*]
            max-memory-mb=1024

            [@analysts]
            max-memory-mb=4096

            [12345]
            max-memory-mb=512
