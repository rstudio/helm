suite: Workbench NOTES.txt
templates:
  - NOTES.txt
tests:
  - it: should warn when components.enabled=true with r-session-complete
    set:
      components:
        enabled: true
      session:
        image:
          repository: "rstudio/r-session-complete"
    asserts:
      - matchRegexRaw:
          pattern: "WARNING.*components\\.enabled=true.*r-session-complete"

  - it: should not warn with new defaults (components.enabled=true + workbench-session)
    set:
      components:
        enabled: true
      session:
        image:
          repository: "posit/workbench-session"
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING.*components\\.enabled=true.*r-session-complete"

  - it: should not warn with legacy opt-out (components.enabled=false + r-session-complete)
    set:
      components:
        enabled: false
      session:
        image:
          repository: "rstudio/r-session-complete"
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING.*components\\.enabled=true.*r-session-complete"

  - it: should fail when image.tagPrefix is set
    set:
      image:
        tagPrefix: "ubuntu2204-"
    asserts:
      - failedTemplate:
          errorPattern: "image.tagPrefix.*has been removed.*image.os"

  - it: should fail when session.image.tagPrefix is set
    set:
      session:
        image:
          tagPrefix: "ubuntu2204-"
    asserts:
      - failedTemplate:
          errorPattern: "session.image.tagPrefix.*has been removed.*session.image.os"

  # -- config file warnings
  - it: should not warn about config files on a default install
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: `.Values.config"

  - it: should warn about each order-sensitive file written as a map
    set:
      config:
        server:
          profiles:
            "*": {max-memory-mb: 1024}
          launcher.kubernetes.resources.conf:
            small: {cpus: 1}
          launcher.local.profiles.conf:
            "*": {max-cpus: 1}
        profiles:
          launcher.kubernetes.profiles.conf:
            "*": {max-cpus: 1}
        session:
          repos.conf:
            Internal: https://pkgs.example.com
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: the following configuration files are written as maps"
      - matchRegexRaw:
          pattern: "- `.Values.config.server.profiles`"
      - matchRegexRaw:
          pattern: "- `.Values.config.server.launcher.kubernetes.resources.conf`"
      - matchRegexRaw:
          pattern: "- `.Values.config.server.launcher.local.profiles.conf`"
      - matchRegexRaw:
          pattern: "- `.Values.config.profiles.launcher.kubernetes.profiles.conf`"
      - matchRegexRaw:
          pattern: "- `.Values.config.session.repos.conf`"

  - it: should not warn about order-sensitive files written as lists
    set:
      config:
        server:
          profiles:
            - "*": {max-memory-mb: 1024}
        session:
          repos.conf:
            - Internal: https://pkgs.example.com
    asserts:
      - notMatchRegexRaw:
          pattern: "written as maps"

  - it: should warn about a repos.conf string without a CRAN line
    set:
      config:
        session:
          repos.conf: |
            Internal=https://pkgs.example.com
    asserts:
      - matchRegexRaw:
          pattern: "repos.conf` is a string with no `CRAN=` line"

  - it: should not warn about a repos.conf string with a CRAN line
    set:
      config:
        session:
          repos.conf: |
            CRAN=https://cran.example.com
            Internal=https://pkgs.example.com
    asserts:
      - notMatchRegexRaw:
          pattern: "no `CRAN=` line"

  # -- table 1 (non-.ini files): a non-empty map warns with the row's fix
  - it: should warn about r-versions written as a map, in config.session or config.server
    set:
      config:
        session:
          r-versions: {Path: /opt/R/4.4.1}
        server:
          r-versions: {Path: /opt/R/4.4.1}
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: `.Values.config.session.r-versions` is written as a map, which renders as .ini, but r-versions is a DCF file that only the Workbench server reads. Write it in config.serverDcf"
      - matchRegexRaw:
          pattern: "WARNING: `.Values.config.server.r-versions` is written as a map"

  - it: should warn about notifications.conf written as a map
    set:
      config:
        session:
          notifications.conf: {Message: hello}
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: `.Values.config.session.notifications.conf` is written as a map, which renders as .ini, but notifications.conf is a DCF file. Write the whole file as a string."

  - it: should warn about json files written as maps, in config.session or config.server
    set:
      config:
        session:
          rstudio-prefs.json: {a: 1}
        server:
          positron-user-settings.json: {a: 1}
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: `.Values.config.session.rstudio-prefs.json` is written as a map, which renders as .ini, but rstudio-prefs.json is a JSON file. Write the whole file as a string."
      - matchRegexRaw:
          pattern: "WARNING: `.Values.config.server.positron-user-settings.json` is written as a map"

  - it: should not warn about an empty map for a non-.ini file
    set:
      config:
        session:
          notifications.conf: {}
    asserts:
      - notMatchRegexRaw:
          pattern: "notifications.conf` is written as a map"

  - it: should not fail when config.profiles is null
    set:
      config:
        profiles: null
    asserts:
      - matchRegexRaw:
          pattern: "successfully deployed"

  - it: should fail on job-json-overrides with useTemplates in a kubernetes profiles list
    set:
      launcher:
        useTemplates: true
      config:
        profiles:
          launcher.kubernetes.profiles.conf:
            - "@gpu":
                job-json-overrides:
                  - name: gpu
                    target: /spec/a
                    json: {}
    asserts:
      - failedTemplate:
          errorPattern: "`profiles` has `job-json-overrides` defined"
