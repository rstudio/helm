suite: Workbench NOTES.txt
templates:
  - NOTES.txt
tests:
  - it: should warn when components.enabled=true with r-session-complete
    set:
      components:
        enabled: true
      session:
        image:
          repository: "rstudio/r-session-complete"
    asserts:
      - matchRegexRaw:
          pattern: "WARNING.*components\\.enabled=true.*r-session-complete"

  - it: should not warn with new defaults (components.enabled=true + workbench-session)
    set:
      components:
        enabled: true
      session:
        image:
          repository: "posit/workbench-session"
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING.*components\\.enabled=true.*r-session-complete"

  - it: should not warn with legacy opt-out (components.enabled=false + r-session-complete)
    set:
      components:
        enabled: false
      session:
        image:
          repository: "rstudio/r-session-complete"
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING.*components\\.enabled=true.*r-session-complete"

  - it: should fail when image.tagPrefix is set
    set:
      image:
        tagPrefix: "ubuntu2204-"
    asserts:
      - failedTemplate:
          errorPattern: "image.tagPrefix.*has been removed.*image.os"

  - it: should fail when session.image.tagPrefix is set
    set:
      session:
        image:
          tagPrefix: "ubuntu2204-"
    asserts:
      - failedTemplate:
          errorPattern: "session.image.tagPrefix.*has been removed.*session.image.os"

  # -- Order-sensitive config files written as maps. See https://github.com/rstudio/helm/issues/944
  - it: should warn when order-sensitive config files are written as maps
    set:
      config:
        server:
          profiles:
            "*":
              max-memory-mb: 1024
            "@analysts":
              max-memory-mb: 4096
          launcher.kubernetes.resources.conf:
            small:
              cpus: 1
            large:
              cpus: 8
        profiles:
          launcher.kubernetes.profiles.conf:
            "*":
              max-cpus: 1
            jsmith:
              max-cpus: 8
        session:
          repos.conf:
            CRAN: https://packagemanager.posit.co/cran/latest
            Internal: https://pkgs.example.com/internal
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: the following configuration files are written as maps"
      - matchRegexRaw:
          pattern: "`\\.Values\\.config\\.server\\.profiles`"
      - matchRegexRaw:
          pattern: "`\\.Values\\.config\\.server\\.launcher\\\\\\.kubernetes\\\\\\.resources\\\\\\.conf`"
      - matchRegexRaw:
          pattern: "`\\.Values\\.config\\.profiles\\.launcher\\\\\\.kubernetes\\\\\\.profiles\\\\\\.conf`"
      - matchRegexRaw:
          pattern: "`\\.Values\\.config\\.session\\.repos\\\\\\.conf`"

  - it: should not warn when order-sensitive config files are written as lists
    set:
      config:
        server:
          profiles:
            - "*":
                max-memory-mb: 1024
          launcher.kubernetes.resources.conf:
            - small:
                cpus: 1
        profiles:
          launcher.kubernetes.profiles.conf:
            - "*":
                max-cpus: 1
        session:
          repos.conf:
            - CRAN: https://packagemanager.posit.co/cran/latest
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: the following configuration files are written as maps"

  - it: should not warn when an order-sensitive config file is written as a raw string
    set:
      config:
        server:
          profiles: |
            [*]
            max-memory-mb=1024
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: the following configuration files are written as maps"

  - it: should not warn for config files whose order does not matter
    set:
      config:
        server:
          rserver.conf:
            www-port: 8787
        session:
          rsession.conf:
            session-timeout-minutes: 60
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: the following configuration files are written as maps"

  - it: should warn for a single-entry map too, now that the gate is gone
    set:
      config:
        server:
          profiles:
            "*":
              max-memory-mb: 1024
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: the following configuration files are written as maps"

  # Workbench discards repos.conf entirely when nothing is named CRAN
  - it: should warn when repos.conf has no CRAN entry
    set:
      config:
        session:
          repos.conf:
            - Internal: https://pkgs.example.com/internal
    asserts:
      - matchRegexRaw:
          pattern: "has no `CRAN` entry"
      - matchRegexRaw:
          pattern: "Workbench ignores the whole file"

  - it: should not warn when a repos.conf list includes CRAN
    set:
      config:
        session:
          repos.conf:
            - Internal: https://pkgs.example.com/internal
            - CRAN: https://mirror.example.com/cran
    asserts:
      - notMatchRegexRaw:
          pattern: "has no `CRAN` entry"

  - it: should not warn when a repos.conf string includes CRAN
    set:
      config:
        session:
          repos.conf: |
            Internal=https://pkgs.example.com/internal
            CRAN=https://mirror.example.com/cran
    asserts:
      - notMatchRegexRaw:
          pattern: "has no `CRAN` entry"

  - it: should not warn about CRAN when repos.conf is suppressed
    set:
      config:
        session:
          repos.conf: null
    asserts:
      - notMatchRegexRaw:
          pattern: "has no `CRAN` entry"

  - it: should not warn about CRAN on a default install
    asserts:
      - notMatchRegexRaw:
          pattern: "has no `CRAN` entry"

  # Derives from NOTES.txt's own list rather than restating it: if a map default is ever added for
  # an order-sensitive file, a default install starts warning about the chart's own values.
  - it: should not warn about the map form on a default install
    asserts:
      - notMatchRegexRaw:
          pattern: "WARNING: the following configuration files are written as maps"
