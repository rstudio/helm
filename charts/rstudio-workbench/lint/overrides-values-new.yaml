# job-json-overrides under config.profiles is the legacy mechanism, and the chart
# fails if it is combined with launcher.useTemplates, which has defaulted to true
# since chart 0.9.0. Opt back out so this fixture exercises what it was written for.
launcher:
  useTemplates: false

license:
  key: real
replicas: 1
rbac:
  create: true
homeStorage:
  create: true
userCreate: true

config:
  profiles:
    launcher.kubernetes.profiles.conf:
      "*":
        container-images:
          - some-image:tag
          - another-image:tag
        job-json-overrides:
          - target: "/spec/template/spec/volumes/-"
            name: volumes
            json:
              configMap:
                defaultMode: 0755
                name: session-config
                items:
                  - path: startup.sh
                    key: startup.sh
              name: session-config
          - target: "/spec/template/spec/containers/0/volumeMounts/-"
            name: volumeMounts
            json:
              mountPath: /usr/local/bin/startup.sh
              name: session-config
              subPath: startup.sh
          - target: "/spec/template/spec/containers/0/command/0"
            name: entrypoint
            json: "/usr/local/bin/startup.sh"
