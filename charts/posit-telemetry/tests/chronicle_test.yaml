suite: Chronicle server type tests
templates:
  - deployment.yaml
  - pvc.yaml
  - clickhouse-statefulset.yaml
  - clickhouse-configmap.yaml
  - clickhouse-service.yaml
  - secret.yaml
chart:
  version: 9.9.9+test
  appVersion: 9.9.9
release:
  name: test-release
  namespace: test-namespace
set:
  serverType: chronicle
tests:
  - it: should run the chronicle binary and disable its in-process agent
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["chronicle"]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHRONICLE_AGENT_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHRONICLE_HTTP_LISTEN
            value: ":4318"
  - it: should enable local storage by default
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHRONICLE_LOCALSTORAGE_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/posit-chronicle
  - it: should request a local-storage PVC of the configured class and size
    template: pvc.yaml
    set:
      chronicle.localStorage.persistence.storageClass: gp3
      chronicle.localStorage.persistence.size: 50Gi
    asserts:
      - equal:
          path: spec.storageClassName
          value: gp3
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
  - it: should support S3 storage instead of local storage
    template: deployment.yaml
    set:
      chronicle.localStorage.enabled: false
      chronicle.s3Storage.enabled: true
      chronicle.s3Storage.bucket: my-bucket
      chronicle.s3Storage.region: us-east-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHRONICLE_S3STORAGE_BUCKET
            value: my-bucket
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHRONICLE_S3STORAGE_REGION
            value: us-east-1
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/posit-chronicle
  - it: should fail without local or S3 storage enabled
    template: deployment.yaml
    set:
      chronicle.localStorage.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: chronicle.localStorage.enabled and/or chronicle.s3Storage.enabled must be true when serverType is "chronicle"
  - it: should not deploy Clickhouse for the chronicle server type
    template: clickhouse-statefulset.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should not deploy a Clickhouse Service for the chronicle server type
    template: clickhouse-service.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should not deploy a Clickhouse ConfigMap for the chronicle server type
    template: clickhouse-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should not generate a Clickhouse password Secret for the chronicle server type
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0
