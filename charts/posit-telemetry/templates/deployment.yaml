{{- include "posit-telemetry.validateServerType" . }}
{{- if and (eq .Values.serverType "chronicle") (not .Values.chronicle.localStorage.enabled) (not .Values.chronicle.s3Storage.enabled) }}
{{- fail "chronicle.localStorage.enabled and/or chronicle.s3Storage.enabled must be true when serverType is \"chronicle\"" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posit-telemetry.fullname" . }}
  labels:
    {{- include "posit-telemetry.labels" . | nindent 4 }}
    {{- include "posit-telemetry.selectorLabels" . | nindent 4 }}
spec:
  # the posit-telemetry server type runs schema migrations on start, and the chronicle server type keeps server-id and
  # local storage on a volume it can't share; either way this assumes it's the only one, even during an upgrade
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "posit-telemetry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "posit-telemetry.labels" . | nindent 8 }}
        {{- include "posit-telemetry.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["{{ .Values.serverType }}"]
          args: ["start"]
          env:
            {{- if eq .Values.serverType "posit-telemetry" }}
            - name: POSIT_TELEMETRY_CLICKHOUSE_ENDPOINT
              value: "clickhouse://{{ include "posit-telemetry.clickhouse.fullname" . }}:{{ .Values.clickhouse.service.port }}"
            - name: POSIT_TELEMETRY_CLICKHOUSE_USERNAME
              value: telemetry
            - name: POSIT_TELEMETRY_CLICKHOUSE_DATABASE
              value: telemetry
            - name: POSIT_TELEMETRY_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "posit-telemetry.clickhouse.secretName" . }}
                  key: {{ include "posit-telemetry.clickhouse.secretKey" . }}
            - name: POSIT_TELEMETRY_COLLECTOR_OTLPHTTPENDPOINT
              value: "0.0.0.0:{{ .Values.service.port }}"
            {{- else }}
            - name: CHRONICLE_HTTP_LISTEN
              value: ":{{ .Values.service.port }}"
            # no product runs on this pod, so there's nothing for an in-process agent to collect from
            - name: CHRONICLE_AGENT_ENABLED
              value: "false"
            - name: CHRONICLE_STATE_RUNTIMEDIR
              value: /run/posit-chronicle
            - name: CHRONICLE_STATE_STATEDIR
              value: /var/lib/posit-chronicle
            - name: CHRONICLE_LOCALSTORAGE_ENABLED
              value: {{ .Values.chronicle.localStorage.enabled | quote }}
            {{- if .Values.chronicle.localStorage.enabled }}
            - name: CHRONICLE_LOCALSTORAGE_LOCATION
              value: /var/lib/posit-chronicle/data
            {{- end }}
            - name: CHRONICLE_S3STORAGE_ENABLED
              value: {{ .Values.chronicle.s3Storage.enabled | quote }}
            {{- if .Values.chronicle.s3Storage.enabled }}
            - name: CHRONICLE_S3STORAGE_BUCKET
              value: {{ required "chronicle.s3Storage.bucket is required when chronicle.s3Storage.enabled is true" .Values.chronicle.s3Storage.bucket | quote }}
            {{- with .Values.chronicle.s3Storage.prefix }}
            - name: CHRONICLE_S3STORAGE_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.chronicle.s3Storage.region }}
            - name: CHRONICLE_S3STORAGE_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.chronicle.s3Storage.profile }}
            - name: CHRONICLE_S3STORAGE_PROFILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.chronicle.s3Storage.endpoint }}
            - name: CHRONICLE_S3STORAGE_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: server
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # the posit-telemetry server type only opens this port once it has reached Clickhouse and run the migrations
          startupProbe:
            tcpSocket:
              port: server
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: server
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # the server's RuntimeDir, for the collector config it generates
            - name: runtime
              mountPath: {{ if eq .Values.serverType "posit-telemetry" }}/run/posit-telemetry{{ else }}/run/posit-chronicle{{ end }}
            {{- if and (eq .Values.serverType "chronicle") .Values.chronicle.localStorage.enabled }}
            - name: data
              mountPath: /var/lib/posit-chronicle
            {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
        {{- if and (eq .Values.serverType "chronicle") .Values.chronicle.localStorage.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "posit-telemetry.data.fullname" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
