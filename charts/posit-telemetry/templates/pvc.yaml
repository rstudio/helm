{{- if and (eq .Values.serverType "chronicle") .Values.chronicle.localStorage.enabled }}
# Kubernetes keeps this volume when the release is uninstalled
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "posit-telemetry.data.fullname" . }}
  labels:
    {{- include "posit-telemetry.labels" . | nindent 4 }}
    {{- include "posit-telemetry.selectorLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.chronicle.localStorage.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.chronicle.localStorage.persistence.size }}
{{- end }}
