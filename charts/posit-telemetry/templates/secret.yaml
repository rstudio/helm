{{- if not .Values.clickhouse.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "posit-telemetry.clickhouse.fullname" . }}
  labels:
    {{- include "posit-telemetry.labels" . | nindent 4 }}
    {{- include "posit-telemetry.clickhouse.selectorLabels" . | nindent 4 }}
type: Opaque
data:
  password: {{ include "posit-telemetry.clickhouse.password" . | b64enc | quote }}
{{- end }}
