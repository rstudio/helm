suite: Profiles Helpers
templates:
  - templates/test-profiles.yaml
values:
  - _base_values.yaml

tests:
  # ========================================
  # Basic profiles.ini Tests
  # ========================================
  - it: should render basic profiles.ini with sections
    set:
      testProfiles:
        basicIni:
          launcher.kubernetes.profiles.conf:
            "*":
              default-cpus: 1
              default-mem-mb: 512
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-ini
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "\\[\\*\\]"
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "default-cpus=1"

  # ========================================
  # profiles.ini.singleFile Tests
  # ========================================
  - it: should render single INI file content
    set:
      testProfiles:
        singleFile:
          "*":
            setting: value1
          testuser:
            setting: value2
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-single-file
      - matchRegex:
          path: data["profiles.conf"]
          pattern: "\\[\\*\\]"
      - matchRegex:
          path: data["profiles.conf"]
          pattern: "\\[testuser\\]"

  # ========================================
  # profiles.ini.collapse-array Tests
  # ========================================
  - it: should collapse simple array with commas
    set:
      testProfiles:
        collapseArray:
          simple:
            - one
            - two
            - three
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-collapse-array
      - equal:
          path: data.simple
          value: "one,two,three"

  - it: should collapse target/file array with quotes and colons
    set:
      testProfiles:
        collapseArray:
          simple:
            - dummy
          targetFile:
            - target: pods
              file: /etc/pods.json
            - target: services
              file: /etc/svc.json
    asserts:
      - matchRegex:
          path: data.targetFile
          pattern: '"pods":"/etc/pods.json"'
      - matchRegex:
          path: data.targetFile
          pattern: '"services":"/etc/svc.json"'

  # ========================================
  # profiles.ini.advanced Tests
  # ========================================
  - it: should render advanced profiles with everyone section
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              "*":
                default-cpus: 2
          jobJsonDefaults: []
          filePath: /etc/rstudio/
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-advanced
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "\\[\\*\\]"
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "default-cpus=2"

  - it: should render advanced profiles written as a list in the order written
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "*": {max-cpus: 1}
              - "@analysts": {max-cpus: 4, container-images: [one, two]}
              - "12345": {max-cpus: 2}
          jobJsonDefaults: []
          filePath: /etc/rstudio/
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [*]
            max-cpus=1

            [@analysts]
            container-images=one,two
            max-cpus=4

            [12345]
            max-cpus=2

  - it: should add [*] at the top of a list with the job-json-overrides defaults and prepend them to other sections
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "@gpu":
                  job-json-overrides:
                    - name: gpu
                      target: /spec/template/spec/tolerations
                      json: []
              - "@cpu": {max-cpus: 2}
          jobJsonDefaults:
            - name: defaultVolume
              target: /spec/template/spec/volumes/-
              json: {}
          filePath: /mnt/overrides/
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [*]
            job-json-overrides="/spec/template/spec/volumes/-":"/mnt/overrides/defaultVolume.json"

            [@gpu]
            job-json-overrides="/spec/template/spec/volumes/-":"/mnt/overrides/defaultVolume.json","/spec/template/spec/tolerations":"/mnt/overrides/gpu.json"

            [@cpu]
            max-cpus=2

  - it: should merge the job-json-overrides defaults into [*] where it is in a list
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "@first": {max-cpus: 2}
              - "*":
                  max-cpus: 1
                  job-json-overrides:
                    - name: everyone
                      target: /spec/a
                      json: {}
              - "@last":
                  job-json-overrides:
                    - name: last
                      target: /spec/b
                      json: {}
          jobJsonDefaults:
            - name: default
              target: /spec/c
              json: {}
          filePath: /m/
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [@first]
            max-cpus=2

            [*]
            job-json-overrides="/spec/c":"/m/default.json","/spec/a":"/m/everyone.json"
            max-cpus=1

            [@last]
            job-json-overrides="/spec/c":"/m/default.json","/spec/a":"/m/everyone.json","/spec/b":"/m/last.json"

  - it: should render advanced profiles written as a map in sorted order, with [*] added
    set:
      testProfiles:
        advanced:
          data:
            launcher.local.profiles.conf:
              "@b": {max-cpus: 2}
              "@a": {max-cpus: 1}
          jobJsonDefaults:
            - name: default
              target: /spec/c
              json: {}
          filePath: /m/
    asserts:
      - equal:
          path: data["launcher.local.profiles.conf"]
          value: |
            [*]
            job-json-overrides="/spec/c":"/m/default.json"

            [@a]
            max-cpus=1

            [@b]
            max-cpus=2

  - it: should allow repeated section names other than [*] in a profiles list
    set:
      testProfiles:
        advanced:
          data:
            launcher.local.profiles.conf:
              - "@a": {max-cpus: 1}
              - "@a": {max-cpus: 2}
          jobJsonDefaults: []
    asserts:
      - equal:
          path: data["launcher.local.profiles.conf"]
          value: |
            [@a]
            max-cpus=1

            [@a]
            max-cpus=2

  - it: should fail when [*] appears twice in a profiles list
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "*": {max-cpus: 1}
              - "@a": {max-cpus: 2}
              - "*": {max-cpus: 3}
          jobJsonDefaults: []
    asserts:
      - failedTemplate:
          errorPattern: "profiles file 'launcher.kubernetes.profiles.conf': the \\[\\*\\] section appears more than once"

  - it: should fail when [*] is a list in a profiles map
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              "*":
                - {max-cpus: 1}
                - {max-cpus: 2}
          jobJsonDefaults: []
    asserts:
      - failedTemplate:
          errorPattern: "profiles file 'launcher.kubernetes.profiles.conf': \\[\\*\\] is a list"

  - it: should fail on a map as an option value in a profiles section
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              "@a":
                limits: {cpu: 1}
          jobJsonDefaults: []
    asserts:
      - failedTemplate:
          errorPattern: "ini file 'launcher.kubernetes.profiles.conf': option 'limits' in section \\[@a\\] is a map"

  - it: should fail on a malformed profiles list entry
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "@a":
                max-cpus: 1
          jobJsonDefaults: []
    asserts:
      - failedTemplate:
          errorPattern: "ini file 'launcher.kubernetes.profiles.conf': list entry 1 has more than one key"

  - it: should fail on a profiles section that is not a map
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              "@a": 5
          jobJsonDefaults: []
    asserts:
      - failedTemplate:
          errorPattern: "\\[@a\\] section must be a 'map'"

  # ========================================
  # profiles.json-from-overrides-config Tests
  # ========================================
  - it: should generate JSON files from overrides config
    set:
      testProfiles:
        jsonOverrides:
          data:
            "*":
              job-json-overrides:
                - name: default-limits
                  target: pods
                  json:
                    resources:
                      limits:
                        cpu: "2"
          default: []
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-json-overrides
      - matchRegex:
          path: data["default-limits.json"]
          pattern: '"resources"'

  - it: should fail when override missing required keys
    set:
      testProfiles:
        jsonOverrides:
          data:
            "*":
              job-json-overrides:
                - name: incomplete
                  json:
                    data: value
          default: []
    asserts:
      - failedTemplate:
          errorPattern: "must have keys 'name', 'json', and 'target'"

  - it: should generate JSON files from overrides in a profiles list
    set:
      testProfiles:
        jsonOverrides:
          data:
            - "@b":
                job-json-overrides:
                  - name: second
                    target: /spec/b
                    json: {b: 1}
            - "*":
                job-json-overrides:
                  - name: first
                    target: /spec/a
                    json: {a: 1}
          default: []
    asserts:
      - equal:
          path: data["first.json"]
          value: |
            {
              "a": 1
            }
      - equal:
          path: data["second.json"]
          value: |
            {
              "b": 1
            }

  # ========================================
  # profiles.apply-everyone-and-default-to-others Tests
  # ========================================
  - it: should apply everyone config to all sections
    set:
      testProfiles:
        applyEveryone:
          data:
            "*":
              shared-setting: everyone-value
            user1:
              user-setting: user1-value
          default: []
          filePath: ""
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-apply-everyone
      - matchRegex:
          path: data["profiles.conf"]
          pattern: "shared-setting=everyone-value"

  # ========================================
  # Type Safety Tests
  # ========================================
  - it: should not render basicIni when value is a string instead of map
    set:
      testProfiles:
        basicIni: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render singleFile when value is a string instead of map
    set:
      testProfiles:
        singleFile: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render collapseArray when value is a string instead of map
    set:
      testProfiles:
        collapseArray: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render advanced when value is a string instead of map
    set:
      testProfiles:
        advanced: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render jsonOverrides when value is a string instead of map
    set:
      testProfiles:
        jsonOverrides: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render applyEveryone when value is a string instead of map
    set:
      testProfiles:
        applyEveryone: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0
