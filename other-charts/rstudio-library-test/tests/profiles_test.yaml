suite: Profiles Helpers
templates:
  - templates/test-profiles.yaml
values:
  - _base_values.yaml

tests:
  # ========================================
  # Basic profiles.ini Tests
  # ========================================
  - it: should render advanced profiles with everyone section
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              "*":
                default-cpus: 2
          jobJsonDefaults: []
          filePath: /etc/rstudio/
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-advanced
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "\\[\\*\\]"
      - matchRegex:
          path: data["launcher.kubernetes.profiles.conf"]
          pattern: "default-cpus=2"

  - it: should render advanced profiles sections from a list in the order written
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - jsmith:
                  default-cpus: 8
              - "@contractors":
                  default-cpus: 2
              - "@analysts":
                  default-cpus: 4
              - "*":
                  default-cpus: 1
          jobJsonDefaults: []
          filePath: /etc/rstudio/
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [jsmith]
            default-cpus=8

            [@contractors]
            default-cpus=2

            [@analysts]
            default-cpus=4

            [*]
            default-cpus=1

  - it: should sort advanced profiles sections by name when written as a map
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              # the test chart's values.yaml default, cleared so the map is exactly what is written
              testuser: null
              jsmith:
                default-cpus: 8
              "@analysts":
                default-cpus: 4
              "*":
                default-cpus: 1
          jobJsonDefaults: []
          filePath: /etc/rstudio/
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [*]
            default-cpus=1

            [@analysts]
            default-cpus=4

            [jsmith]
            default-cpus=8

  - it: should prepend jobJsonDefaults to each ordered section that sets its own overrides
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "@contractors":
                  job-json-overrides:
                    - name: contractorNode
                      target: /spec/template/spec/nodeSelector
                      json:
                        tier: contractor
              - "*":
                  default-cpus: 1
          jobJsonDefaults:
            - name: sharedVolume
              target: /spec/template/spec/volumes/-
              json:
                name: shared
          filePath: /etc/rstudio/
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [@contractors]
            job-json-overrides="/spec/template/spec/volumes/-":"/etc/rstudio/sharedVolume.json","/spec/template/spec/nodeSelector":"/etc/rstudio/contractorNode.json"

            [*]
            default-cpus=1
            job-json-overrides="/spec/template/spec/volumes/-":"/etc/rstudio/sharedVolume.json"

  - it: should add an everyone section for jobJsonDefaults when the ordered list has none
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - jsmith:
                  default-cpus: 8
          jobJsonDefaults:
            - name: sharedVolume
              target: /spec/template/spec/volumes/-
              json:
                name: shared
          filePath: /etc/rstudio/
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [*]
            job-json-overrides="/spec/template/spec/volumes/-":"/etc/rstudio/sharedVolume.json"

            [jsmith]
            default-cpus=8

  - it: should fail when advanced profiles content is neither a map nor a list
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf: "not-a-map"
          jobJsonDefaults: []
    asserts:
      - failedTemplate:
          errorPattern: "must be a 'map' of section headers and configuration, or a 'slice' of single-entry maps"

  - it: should generate JSON files from overrides config
    set:
      testProfiles:
        jsonOverrides:
          data:
            "*":
              job-json-overrides:
                - name: default-limits
                  target: pods
                  json:
                    resources:
                      limits:
                        cpu: "2"
          default: []
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-json-overrides
      - matchRegex:
          path: data["default-limits.json"]
          pattern: '"resources"'

  - it: should fail when override missing required keys
    set:
      testProfiles:
        jsonOverrides:
          data:
            "*":
              job-json-overrides:
                - name: incomplete
                  json:
                    data: value
          default: []
    asserts:
      - failedTemplate:
          errorPattern: "must have keys 'name', 'json', and 'target'"

  # ========================================
  # profiles.apply-everyone-and-default-to-others Tests
  # ========================================
  - it: should apply everyone config to all sections
    set:
      testProfiles:
        applyEveryone:
          data:
            "*":
              shared-setting: everyone-value
            user1:
              user-setting: user1-value
          default: []
          filePath: ""
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-profiles-apply-everyone
      - matchRegex:
          path: data["profiles.conf"]
          pattern: "shared-setting=everyone-value"

  # ========================================
  # Type Safety Tests
  # ========================================
  - it: should not render singleFile when value is a string instead of map
    set:
      testProfiles:
        singleFile: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render advanced when value is a string instead of map
    set:
      testProfiles:
        advanced: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render jsonOverrides when value is a string instead of map
    set:
      testProfiles:
        jsonOverrides: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render applyEveryone when value is a string instead of map
    set:
      testProfiles:
        applyEveryone: "not-a-map"
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when one profiles list entry holds several sections
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "@analysts":
                  default-cpus: 4
                "@contractors":
                  default-cpus: 2
          jobJsonDefaults: []
    asserts:
      - failedTemplate:
          errorPattern: "An entry written as a list holds 2 keys: @analysts, @contractors"

  - it: should still comma-join a list inside a profiles section
    set:
      testProfiles:
        advanced:
          data:
            launcher.kubernetes.profiles.conf:
              - "*":
                  some-key:
                    - value1
                    - value2
          jobJsonDefaults: []
    asserts:
      - equal:
          path: data["launcher.kubernetes.profiles.conf"]
          value: |
            [*]
            some-key=value1,value2
